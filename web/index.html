<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="RC Final Drive Ratio calculator and gearing preset manager.">
  <meta name="theme-color" content="#0B132B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quick FDR">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quick FDR</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #pwa-install-banner {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 2147483647;
      display: none;
      align-items: center;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 14px;
      background: #1C2541;
      color: #FFFFFF;
      border: 1px solid #2C3E6B;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #pwa-install-banner.visible {
      display: flex;
    }
    #pwa-install-banner img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    #pwa-install-text {
      flex: 1;
      min-width: 0;
    }
    #pwa-install-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.25;
    }
    #pwa-install-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: #8D99AE;
      line-height: 1.35;
    }
    #pwa-install-subtitle strong {
      color: #00E5FF;
      font-weight: 600;
    }
    #pwa-install-action {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      background: #3A86FF;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    #pwa-install-action[hidden] {
      display: none;
    }
    #pwa-install-close {
      border: none;
      background: transparent;
      color: #8D99AE;
      font-size: 18px;
      line-height: 1;
      padding: 4px 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body style="background-color: #0B132B;">
  <div id="pwa-install-banner" role="dialog" aria-label="Install Quick FDR">
    <img src="icons/Icon-192.png" alt="Quick FDR icon" />
    <div id="pwa-install-text">
      <div id="pwa-install-title">Install Quick FDR</div>
      <div id="pwa-install-subtitle"></div>
    </div>
    <button id="pwa-install-action" type="button" hidden>Install</button>
    <button id="pwa-install-close" type="button" aria-label="Dismiss install prompt">&times;</button>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        const hadController = Boolean(navigator.serviceWorker.controller);
        let refreshing = false;

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController || refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then(function (registration) {
              registration.update();
            });
      });
    }

    (function () {
      const DISMISS_KEY = 'quick_fdr_install_dismissed_at';
      const DISMISS_TTL_MS = 7 * 24 * 60 * 60 * 1000;

      const banner = document.getElementById('pwa-install-banner');
      const subtitle = document.getElementById('pwa-install-subtitle');
      const actionBtn = document.getElementById('pwa-install-action');
      const closeBtn = document.getElementById('pwa-install-close');

      const isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      if (isStandalone) return;

      let dismissedAt = 0;
      try {
        dismissedAt = Number(localStorage.getItem(DISMISS_KEY) || 0);
      } catch (_) {}
      if (dismissedAt && Date.now() - dismissedAt < DISMISS_TTL_MS) {
        return;
      }

      const isIos =
        /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /android/i.test(navigator.userAgent);

      let deferredPrompt = null;
      let fallbackTimer = null;
      let onInstalledCallback = null;

      function checkStandalone() {
        return (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true
        );
      }

      function showInstructionsBanner() {
        if (isIos) {
          subtitle.innerHTML = 'Tap <strong>Share</strong> then <strong>Add to Home Screen</strong> for offline access.';
        } else if (isAndroid) {
          subtitle.innerHTML = 'Tap browser <strong>menu (&#8942;)</strong> then <strong>Install app</strong> for offline access.';
        } else {
          subtitle.innerHTML = 'Click the <strong>Install</strong> icon in your browser address bar or menu.';
        }
        actionBtn.hidden = true;
        banner.classList.add('visible');
      }

      window.quickFdrPwaCanShow = function () {
        return !checkStandalone();
      };

      window.quickFdrPwaSetOnInstalled = function (cb) {
        onInstalledCallback = typeof cb === 'function' ? cb : null;
      };

      window.quickFdrPwaTriggerInstall = async function () {
        if (checkStandalone()) return;
        try {
          localStorage.removeItem(DISMISS_KEY);
        } catch (_) {}

        if (deferredPrompt) {
          const promptEvent = deferredPrompt;
          deferredPrompt = null;
          promptEvent.prompt();
          const choice = await promptEvent.userChoice;
          if (choice && choice.outcome === 'accepted') {
            hideBanner(false);
          } else {
            showInstructionsBanner();
          }
          return;
        }

        showInstructionsBanner();
      };

      function hideBanner(persistDismiss) {
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        banner.classList.remove('visible');
        if (persistDismiss) {
          try {
            localStorage.setItem(DISMISS_KEY, String(Date.now()));
          } catch (_) {}
        }
      }

      closeBtn.addEventListener('click', function () {
        hideBanner(true);
      });

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        if (checkStandalone()) return;

        subtitle.textContent = 'Add to your home screen for offline pit-bench use.';
        actionBtn.hidden = false;
        banner.classList.add('visible');
      });

      actionBtn.addEventListener('click', async function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (choice && choice.outcome === 'accepted') {
          hideBanner(false);
        } else {
          hideBanner(true);
        }
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        hideBanner(false);
        if (onInstalledCallback) {
          onInstalledCallback();
        }
      });

      if (isIos) {
        showInstructionsBanner();
      } else if (isAndroid) {
        // Fallback when Chrome suppresses beforeinstallprompt or in browsers without it
        fallbackTimer = setTimeout(function () {
          if (deferredPrompt) return;
          showInstructionsBanner();
        }, 1500);
      }
    })();
  </script>
</body>
</html>
